name: Docker Image CI

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve MediaFlick build metadata
        id: build-meta
        run: |
          sha_short="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "build_kind=release" >> "${GITHUB_OUTPUT}"
            echo "git_tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=dev+${sha_short}" >> "${GITHUB_OUTPUT}"
            echo "build_kind=dev" >> "${GITHUB_OUTPUT}"
            echo "git_tag=" >> "${GITHUB_OUTPUT}"
          fi
          echo "commit_sha=${sha_short}" >> "${GITHUB_OUTPUT}"
          echo "git_dirty=false" >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MEDIAFLICK_VERSION=${{ steps.build-meta.outputs.version }}
            MEDIAFLICK_BUILD_KIND=${{ steps.build-meta.outputs.build_kind }}
            MEDIAFLICK_GIT_TAG=${{ steps.build-meta.outputs.git_tag }}
            MEDIAFLICK_COMMIT_SHA=${{ steps.build-meta.outputs.commit_sha }}
            MEDIAFLICK_GIT_DIRTY=${{ steps.build-meta.outputs.git_dirty }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
