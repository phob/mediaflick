name: Create Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.2.4"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: release
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH, for example v0.2.4" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} already exists" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Update VERSION file
        shell: bash
        run: |
          printf '%s\n' "${{ steps.release.outputs.version }}" > VERSION

      - name: Commit VERSION change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          if git diff --cached --quiet; then
            echo "VERSION already contains ${{ steps.release.outputs.version }}" >&2
            exit 1
          fi
          git commit -m "Release ${{ steps.release.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create and push tag
        shell: bash
        run: |
          git tag "${{ steps.release.outputs.version }}"
          git push origin "${{ steps.release.outputs.version }}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.release.outputs.version }}" \
            --draft \
            --title "${{ steps.release.outputs.version }}" \
            --notes "Draft release for ${{ steps.release.outputs.version }}. Run Docker Image CI to publish the container image." \
            --target "${{ steps.release.outputs.version }}"
